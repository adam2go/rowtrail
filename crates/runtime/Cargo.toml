[package]
name = "rowtrail-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rowtrail-contracts = { path = "../contracts" }
rowtrail-client = { path = "../client" }
datafusion = { version = "=55.0.0", default-features = false, features = ["sql", "parquet", "datetime_expressions", "string_expressions", "unicode_expressions", "math_expressions", "recursive_protection"] }
arrow = { version = "=59.2.0", default-features = false, features = ["ipc", "ipc_compression", "csv", "json"] }
arrow-schema = { version = "=59.2.0", features = ["serde"] }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
object_store = { version = "=0.13.2", default-features = false }
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
futures = "0.3"
async-trait = "0.1"
bytes = "1"
url = "2"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
csv = "1"

datafusion-catalog = { version = "=55.0.0", default-features = false }
datafusion-catalog-listing = { version = "=55.0.0", default-features = false }
datafusion-common = { version = "=55.0.0", default-features = false }
datafusion-common-runtime = { version = "=55.0.0", default-features = false }
datafusion-datasource = { version = "=55.0.0", default-features = false }
datafusion-datasource-arrow = { version = "=55.0.0", default-features = false }
datafusion-datasource-csv = { version = "=55.0.0", default-features = false }
datafusion-datasource-json = { version = "=55.0.0", default-features = false }
datafusion-datasource-parquet = { version = "=55.0.0", default-features = false }
datafusion-doc = { version = "=55.0.0", default-features = false }
datafusion-execution = { version = "=55.0.0", default-features = false }
datafusion-expr = { version = "=55.0.0", default-features = false }
datafusion-expr-common = { version = "=55.0.0", default-features = false }
datafusion-functions = { version = "=55.0.0", default-features = false }
datafusion-functions-aggregate = { version = "=55.0.0", default-features = false }
datafusion-functions-aggregate-common = { version = "=55.0.0", default-features = false }
datafusion-functions-nested = { version = "=55.0.0", default-features = false }
datafusion-functions-table = { version = "=55.0.0", default-features = false }
datafusion-functions-window = { version = "=55.0.0", default-features = false }
datafusion-functions-window-common = { version = "=55.0.0", default-features = false }
datafusion-macros = { version = "=55.0.0", default-features = false }
datafusion-optimizer = { version = "=55.0.0", default-features = false }
datafusion-physical-expr = { version = "=55.0.0", default-features = false }
datafusion-physical-expr-adapter = { version = "=55.0.0", default-features = false }
datafusion-physical-expr-common = { version = "=55.0.0", default-features = false }
datafusion-physical-optimizer = { version = "=55.0.0", default-features = false }
datafusion-physical-plan = { version = "=55.0.0", default-features = false }
datafusion-pruning = { version = "=55.0.0", default-features = false }
datafusion-session = { version = "=55.0.0", default-features = false }
datafusion-sql = { version = "=55.0.0", default-features = false }
arrow-buffer = { version = "=59.2.0", default-features = false }
