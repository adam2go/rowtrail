name: Reproducible bug
description: A wrong answer, broken contract, installation failure or crash.
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: RowTrail version, OS/architecture and entry (CLI, session, MCP or SDK).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands/JSON plus a small synthetic input or a recipe to generate it. Remove private paths and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the complete error or bounded observation, with state, quality and truncation fields.
    validations:
      required: true
