  <g id="text_44">
   <text style="fill: #4e6558; font: 10px 'DejaVu Sans'; text-anchor: start" x="64.8" y="366.3" transform="rotate(-0 64.8 366.3)">100K rows · one Mac · seven rotated trials · medians. Schema search is a separate metadata probe.</text>
