  <g id="text_36">
   <text style="fill: #53635e; font: 11px 'DejaVu Sans'; text-anchor: start" x="39.168" y="397.296" transform="rotate(-0 39.168 397.296)">Direct engines retain in-memory tables; DataFusion startup excluded. RowTrail persists and verifies results.</text>
